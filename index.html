<style>
:root{
  --forest-900:#0E2A1D;
  --forest-800:#153B27;
  --forest-700:#1E5631;
  --forest-600:#2D7A46;
  --forest-500:#3C9257;
  --lime:#C6F135;
  --lime-dark:#A9D91F;
  --bg:#F4F7F4;
  --card:#FFFFFF;
  --text:#16241C;
  --muted:#67796E;
  --muted-2:#8C9C93;
  --border:#E4EAE5;
  --danger:#E5484D;
  --danger-bg:#FDECEC;
  --warning:#F0A83A;
  --warning-bg:#FFF4E2;
  --success:#2D9D5F;
  --success-bg:#E7F7ED;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm: 0 2px 8px rgba(14,42,29,0.06);
  --shadow-md: 0 6px 20px rgba(14,42,29,0.10);
  --shadow-lg: 0 12px 36px rgba(14,42,29,0.16);
  --nav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.02em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--lime);color:var(--forest-900);}

/* Scrollbar minimal */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D3DDD6;border-radius:8px;}

/* ---------- Layout shells ---------- */
#app{min-height:100vh;}
.screen{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--nav-h) + 24px);}
.screen.no-nav{padding-bottom:24px;}
.screen.wide{max-width:1040px;}

@media (min-width:900px){
  .screen{max-width:1040px;}
}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(244,247,244,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar .tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:16px;flex:none;box-shadow:var(--shadow-sm);transition:transform .15s;
}
.icon-btn:active{transform:scale(0.92);}
.back-btn{background:none;border:none;font-size:22px;padding:4px 6px 4px 0;color:var(--forest-800);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;font-weight:700;font-size:15px;
  transition:transform .12s ease, box-shadow .12s ease; white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--forest-700);color:#fff;box-shadow:0 4px 14px rgba(30,86,49,0.35);}
.btn-primary:hover{background:var(--forest-600);}
.btn-lime{background:var(--lime);color:var(--forest-900);box-shadow:0 4px 14px rgba(198,241,53,0.4);}
.btn-lime:hover{background:var(--lime-dark);}
.btn-outline{background:var(--card);color:var(--forest-800);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--forest-500);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-ghost{background:transparent;color:var(--forest-700);padding:10px 12px;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:50%;}
.btn[disabled]{opacity:.5;pointer-events:none;}

.fab{
  position:fixed;right:20px;bottom:calc(var(--nav-h) + 20px);
  width:56px;height:56px;border-radius:50%;background:var(--forest-700);color:#fff;
  border:none;font-size:26px;box-shadow:0 8px 20px rgba(30,86,49,0.4);z-index:35;
  display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(0.92);}
@media (min-width:900px){.fab{right:calc(50% - 500px);}}

/* ---------- Cards ---------- */
.card{
  background:var(--card);border-radius:var(--radius-lg);padding:18px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
}
.card + .card{margin-top:12px;}
.section{padding:16px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title h3{font-size:16px;}
.link-sm{font-size:13px;font-weight:700;color:var(--forest-700);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (min-width:640px){.sm\:grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}}

.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;text-align:center;}
.stat-box .num{font-size:20px;font-weight:800;color:var(--forest-800);}
.stat-box .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ---------- Landing ---------- */
.hero{
  position:relative;min-height:440px;border-radius:0 0 32px 32px;overflow:hidden;
  background:linear-gradient(180deg, rgba(14,42,29,0.55), rgba(14,42,29,0.88)),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900"><rect width="800" height="900" fill="%23274b39"/><polygon points="0,900 150,500 320,700 480,350 650,650 800,450 800,900" fill="%231c3a2c"/><polygon points="0,900 250,600 400,780 600,500 800,700 800,900" fill="%2314301f"/><circle cx="620" cy="180" r="70" fill="%23ffe9a8" opacity="0.85"/></svg>') center/cover no-repeat;
  padding:20px 22px 32px;display:flex;flex-direction:column;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;color:#fff;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;}
.brand .mark{font-size:22px;}
.hero-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:60px;}
.hero h1{color:#fff;font-size:34px;line-height:1.12;}
.hero h1 span{color:var(--lime);}
.hero p{color:#E7EFE9;margin-top:12px;font-size:15px;line-height:1.5;max-width:340px;}
.hero-ctas{display:flex;flex-direction:column;gap:10px;margin-top:22px;max-width:320px;}
.hero-ctas .btn{width:100%;}

.tagline-strip{padding:20px 18px 6px;}
.tagline-strip h3{font-size:17px;color:var(--forest-800);}

.feature-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);}
.feature-card .fi{width:38px;height:38px;border-radius:10px;background:var(--success-bg);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:8px;}
.feature-card h4{font-size:13.5px;margin-bottom:4px;}
.feature-card p{font-size:12px;color:var(--muted);line-height:1.4;}

.landing-footer{padding:26px 18px 8px;text-align:center;color:var(--muted-2);font-size:12px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);z-index:50;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;justify-content:space-around;
  box-shadow:0 -4px 16px rgba(14,42,29,0.06);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:10.5px;font-weight:700;background:none;border:none;
}
.nav-item .ni{font-size:19px;width:34px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:.15s;}
.nav-item.active{color:var(--forest-700);}
.nav-item.active .ni{background:var(--success-bg);}
@media (min-width:900px){.bottom-nav{max-width:1040px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0;}}

/* ---------- Progress ---------- */
.progress-bar{width:100%;height:9px;border-radius:6px;background:#EAF0EB;overflow:hidden;}
.progress-bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--forest-600),var(--lime));transition:width .5s cubic-bezier(.2,.8,.2,1);}
.progress-ring-wrap{position:relative;width:132px;height:132px;margin:0 auto;}
.progress-ring-wrap svg{transform:rotate(-90deg);}
.progress-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.progress-ring-label .pct{font-size:28px;font-weight:800;color:var(--forest-800);}
.progress-ring-label .lbl{font-size:11px;color:var(--muted);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-muted{background:#EEF2EE;color:var(--muted);}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--forest-800);margin-bottom:6px;}
.field .hint{font-size:11px;color:var(--muted-2);margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=tel],.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:#FBFCFB;font-size:14.5px;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--forest-500);background:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:18px;font-weight:800;color:var(--forest-800);}
.stepper input{text-align:center;width:100%;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--text);}
.chip.active{background:var(--forest-700);color:#fff;border-color:var(--forest-700);}
.role-chip.active{background:var(--lime);color:var(--forest-900);border-color:var(--lime);}

/* Segmented tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex:none;padding:9px 15px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--muted);}
.tab-btn.active{background:var(--forest-700);color:#fff;border-color:var(--forest-700);}

/* ---------- Checklist rows ---------- */
.check-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.checkbox{
  width:26px;height:26px;border-radius:8px;border:2px solid #C9D4CC;flex:none;
  display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s;
}
.checkbox.on{background:var(--forest-700);border-color:var(--forest-700);color:#fff;transform:scale(1.05);}
.check-row .ci-name{flex:1;font-size:14.5px;font-weight:600;}
.check-row.done .ci-name{color:var(--muted-2);text-decoration:line-through;}
.check-row .ci-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.cat-card{display:flex;align-items:center;gap:14px;padding:14px;}
.cat-card .cat-icon{width:44px;height:44px;border-radius:12px;background:var(--success-bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.cat-card .cat-body{flex:1;min-width:0;}
.cat-card .cat-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:6px;}
.cat-card .cat-sub{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.chev{color:var(--muted-2);font-size:18px;}

/* Member cards */
.member-card{display:flex;align-items:center;gap:12px;padding:13px;}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--forest-600),var(--forest-800));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;}
.member-card .m-name{font-weight:700;font-size:14px;}
.member-card .m-role{font-size:11.5px;color:var(--forest-700);font-weight:700;}
.member-card .m-phone{font-size:11.5px;color:var(--muted);margin-top:1px;}

/* Carrier cards */
.carrier-card{padding:15px;}
.carrier-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.carrier-head .ch-left{display:flex;align-items:center;gap:10px;}
.carrier-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:none;}

/* Timeline */
.timeline{position:relative;padding-left:26px;}
.timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--forest-700);border:3px solid var(--success-bg);}
.tl-time{font-size:12px;font-weight:800;color:var(--forest-700);}
.tl-title{font-size:14px;font-weight:700;margin-top:2px;}
.tl-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* Empty state */
.empty-state{padding:44px 20px;text-align:center;}
.empty-state .es-icon{font-size:40px;margin-bottom:10px;}
.empty-state h4{font-size:15px;margin-bottom:6px;}
.empty-state p{font-size:12.5px;color:var(--muted);max-width:280px;margin:0 auto 16px;line-height:1.5;}

/* Toast */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;pointer-events:none;}
.toast{background:var(--forest-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;max-width:88%;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--forest-700);}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(14,26,20,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;}
@media (min-width:640px){.modal-overlay{align-items:center;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px;animation:slideUp .22s cubic-bezier(.2,.8,.2,1);}
@media (min-width:640px){.modal-box{border-radius:22px;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-close{background:#F0F3F0;border:none;width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--muted);}
.modal-actions{display:flex;gap:10px;margin-top:6px;position:sticky;bottom:0;background:#fff;padding-top:10px;}
.modal-actions .btn{flex:1;}

/* Weight bars */
.wbar-row{margin-bottom:12px;}
.wbar-row .wb-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
.wbar-track{height:10px;background:#EAF0EB;border-radius:6px;overflow:hidden;}
.wbar-fill{height:100%;border-radius:6px;}

/* Loading */
.spinner{width:26px;height:26px;border:3px solid #DCE6DF;border-top-color:var(--forest-700);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--muted);font-size:13px;}

/* Trip banner list */
.trip-mini{display:flex;align-items:center;gap:12px;padding:13px;}
.trip-mini .tm-icon{width:44px;height:44px;border-radius:12px;background:var(--forest-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.trip-mini .tm-name{font-weight:700;font-size:14px;}
.trip-mini .tm-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

.quickmenu{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.qm-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 4px;font-size:10.5px;font-weight:700;color:var(--forest-800);}
.qm-item .qi{width:32px;height:32px;border-radius:9px;background:var(--success-bg);display:flex;align-items:center;justify-content:center;font-size:15px;}

.divider{height:1px;background:var(--border);margin:14px 0;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}.mt-20{margin-top:20px;}

function userCol(storeName){
  if(!currentUser) throw new Error('Belum login');
  return dbFs.collection('users').doc(currentUser.uid).collection(storeName);
}
// Kept for compatibility with init(); Firestore needs no schema/open step,

function openDB(){ return Promise.resolve(true); }

async function idbGetAll(storeName){
  const snap = await userCol(storeName).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function idbGetAllByTrip(storeName, tripId){
  const snap = await userCol(storeName).where('tripId','==',tripId).get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function idbGet(storeName, id){
  if(id==null) return undefined;
  const doc = await userCol(storeName).doc(String(id)).get();
  return doc.exists ? {id:doc.id, ...doc.data()} : undefined;
}
async function idbPut(storeName, obj){
  const id = obj.id!=null ? String(obj.id) : uid();
  const {id:_omit, ...data} = obj;
  await userCol(storeName).doc(id).set(data, {merge:false});
  return {id, ...data};
}
async function idbDelete(storeName, id){
  await userCol(storeName).doc(String(id)).delete();
  return true;
}
async function idbDeleteByTrip(storeName, tripId){
  const items = await idbGetAllByTrip(storeName, tripId);
  const batch = dbFs.batch();
  items.forEach(it=> batch.delete(userCol(storeName).doc(it.id)));
  if(items.length) await batch.commit();
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);

/* ---------------- Formatting helpers ---------------- */
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtKg(n){ return (Math.round((n||0)*100)/100).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:2})+' kg'; }
function fmtNum(n){ return (n||0).toLocaleString('id-ID'); }
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function statusFromProgress(pct){
  if(pct>=100) return {label:'Siap Berangkat', cls:'success', dot:'🟢'};
  if(pct>=80) return {label:'Hampir Siap', cls:'success', dot:'🟢'};
  if(pct>=50) return {label:'Persiapan', cls:'warning', dot:'🟡'};
  return {label:'Belum Siap', cls:'danger', dot:'🔴'};
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Data aggregation helpers ---------------- */
async function getAllTrips(){
  const trips = await idbGetAll('trips');
  return trips.sort((a,b)=> new Date(a.startDate||'2999-01-01') - new Date(b.startDate||'2999-01-01'));
}
async function getUpcomingTrip(){
  const trips = await getAllTrips();
  if(!trips.length) return null;
  const currentId = state.currentTripId || await getSetting('lastTripId');
  if(currentId){
    const t = trips.find(x=>x.id===currentId);
    if(t) return t;
  }
  const today = new Date().toISOString().slice(0,10);
  return trips.find(t=>t.startDate>=today) || trips[trips.length-1];
}
async function ensureCurrentTrip(){
  if(state.currentTripId){
    const t = await idbGet('trips', state.currentTripId);
    if(t) return t;
  }
  const t = await getUpcomingTrip();
  if(t){ state.currentTripId = t.id; await setSetting('lastTripId', t.id); }
  return t;
}
async function checklistProgress(tripId){
  const items = await idbGetAllByTrip('checklistItems', tripId);
  const total = items.length;
  const done = items.filter(i=>i.checked).length;
  const pct = total? Math.round((done/total)*100) : 0;
  return {total, done, pct, items};
}
async function categoryProgress(tripId, catKey){
  const items = await idbGetAllByTrip('checklistItems', tripId);
  const catItems = items.filter(i=>i.category===catKey);
  const total = catItems.length;
  const done = catItems.filter(i=>i.checked).length;
  return {total, done, pct: total? Math.round((done/total)*100):0, items:catItems};
}
async function totalWeight(tripId){
  const items = await idbGetAllByTrip('checklistItems', tripId);
  return items.reduce((s,i)=> s + (i.qty||0)*(i.unitWeight||0), 0);
}
async function weightByCarrier(tripId){
  const items = await idbGetAllByTrip('checklistItems', tripId);
  const carriers = await idbGetAllByTrip('carriers', tripId);
  const map = {};
  carriers.forEach(c=> map[c.id] = {carrier:c, weight:0, count:0});
  let unassigned = 0, unassignedCount=0;
  items.forEach(i=>{
    const w = (i.qty||0)*(i.unitWeight||0);
    if(i.carrierId && map[i.carrierId]){ map[i.carrierId].weight += w; map[i.carrierId].count++; }
    else { unassigned += w; unassignedCount++; }
  });
  return {byCarrier:Object.values(map), unassigned, unassignedCount};
}

/* ---------------- Seed default checklist for a trip ---------------- */
async function seedChecklist(tripId){
  for(const cat of CATEGORY_DEFS){
    for(const [name, qty, unitWeight] of DEFAULT_ITEMS[cat.key]){
      await idbPut('checklistItems', {
        id:uid(), tripId, category:cat.key, name, qty, unitWeight, checked:false, carrierId:null, isCustom:false
      });
    }
  }
}

/* ---------------- Recommendation engine (rule-based) ---------------- */
function computeRecommendations(trip){
  const dur = getDuration(trip);
  const pax = trip.pendakiCount || 1;
  const days = dur.days || 1;
  const rec = {};
  rec['Beras / nasi instan'] = Math.max(1, Math.ceil(pax*days*0.35));
  rec['Lauk'] = Math.max(1, pax*days);
  rec['Sarapan'] = Math.max(1, pax*days);
  rec['Snack'] = Math.max(1, pax*days*2);
  rec['Energy bar'] = Math.max(1, pax*days);
  rec['Kantong sampah'] = Math.max(1, Math.ceil(days*1.5));
  rec['Gas'] = Math.max(1, Math.ceil((pax*days)/8));
  rec['Air awal'] = Math.max(pax, Math.ceil(pax*days*2.8));
  rec['Baterai cadangan'] = Math.max(2, pax>=4? pax : 2);
  rec['Power bank'] = Math.max(1, Math.ceil(pax/2));
  rec['Pakaian ganti'] = Math.max(1, dur.nights);
  rec['Kaos kaki'] = Math.max(2, dur.nights+1);
  return {dur, pax, rec};
}
function waterRecommendation(pax, days, perPersonPerDay, sourceLevel){
  let liters = pax*days*perPersonPerDay;
  let low = liters*0.85, high = liters*1.15;
  if(sourceLevel==='ada'){ low*=0.6; high*=0.75; }
  else if(sourceLevel==='melimpah'){ low*=0.35; high*=0.5; }
  return {low:Math.round(low), high:Math.round(high)};
}

function ringSvg(pct, size=132){
  const r = size/2 - 10, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EAF0EB" stroke-width="10"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s;"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1E5631"/><stop offset="100%" stop-color="#C6F135"/></linearGradient></defs>
  </svg>`;
}

  document.getElementById('durationChips').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip'); if(!btn) return;
    form.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    durationType = btn.dataset.dur;
    document.getElementById('customDurWrap').style.display = durationType==='custom'?'grid':'none';
  });
  form.addEventListener('submit', async (e)=>{

    const fd = new FormData(form);

    if(!mountain){ toast('Nama gunung wajib diisi','err'); return; }
    const data = {
      id: editId || uid(),
      mountain, tripName: fd.get('tripName')||'',
      startDate: fd.get('startDate')||'', endDate: fd.get('endDate')||'',
      durationType, customDays: Number(fd.get('customDays'))||null, customNights: Number(fd.get('customNights'))||null,

      carrierTargetWeight: Number(fd.get('carrierTargetWeight'))||15,
      routeUp: fd.get('routeUp')||'', routeDown: fd.get('routeDown')||'', basecamp: fd.get('basecamp')||'',
      startTimeEst: fd.get('startTimeEst')||'', summitTimeEst: fd.get('summitTimeEst')||'',
      notes: fd.get('notes')||'',
      emergency: (editId && (await idbGet('trips', editId))?.emergency) || {},
      createdAt: editId ? (await idbGet('trips', editId))?.createdAt || new Date().toISOString() : new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    await idbPut('trips', data);
    if(!editId){
      await seedChecklist(data.id);
      // auto create carriers
      for(let i=1;i<=data.carrierCount;i++){
        await idbPut('carriers', {id:uid(), tripId:data.id, label:'Carrier '+i, owner:'', targetWeight:data.carrierTargetWeight});
      }
    }
    state.currentTripId = data.id;
    await setSetting('lastTripId', data.id);
    toast(editId? 'Pendakian diperbarui':'Pendakian dibuat!');
    navigate('#/dashboard');
  });
}

      <button class="btn btn-lime btn-block mt-12" id="applyWaterRec">Terapkan ke Checklist (Air awal: ${wr.high} item)</button>

async function logistikWeightTab(trip){
  const items = await idbGetAllByTrip('checklistItems', trip.id);
  const {byCarrier} = await weightByCarrier(trip.id);
  const total = items.reduce((s,i)=>s+(i.qty||0)*(i.unitWeight||0),0);
  const byCat = CATEGORY_DEFS.map(c=>{
    const w = items.filter(i=>i.category===c.key).reduce((s,i)=>s+(i.qty||0)*(i.unitWeight||0),0);
    return {...c, weight:w};
  });
  const maxCat = Math.max(1,...byCat.map(c=>c.weight));
  const maxCarrier = Math.max(1,...byCarrier.map(c=>c.weight));
  return `
    <div class="card">
      <div class="small muted">Total Berat Seluruh Tim</div>
      <div style="font-size:26px;font-weight:800;color:var(--forest-800);">${fmtKg(total)}</div>
      <div class="small muted mt-8">${items.length} item terdaftar</div>
    </div>
    <div class="card mt-12">
      <h4 class="mt-8" style="font-size:14px;margin-bottom:10px;">Berat per Kategori</h4>
      ${byCat.map(c=>`
        <div class="wbar-row">
          <div class="wb-top"><span>${c.icon} ${c.label}</span><span>${fmtKg(c.weight)}</span></div>
          <div class="wbar-track"><div class="wbar-fill" style="width:${(c.weight/maxCat*100)||0}%;background:var(--forest-600);"></div></div>
        </div>`).join('')}
    </div>
    <div class="card mt-12">
      <h4 class="mt-8" style="font-size:14px;margin-bottom:10px;">Berat per Carrier</h4>
      ${byCarrier.length? byCarrier.map(c=>`
        <div class="wbar-row">
          <div class="wb-top"><span>${escapeHtml(c.carrier.label)}</span><span>${fmtKg(c.weight)}</span></div>
          <div class="wbar-track"><div class="wbar-fill" style="width:${(c.weight/maxCarrier*100)||0}%;background:${c.weight>(c.carrier.targetWeight||99999)?'var(--danger)':'var(--lime-dark)'};"></div></div>
        </div>`).join('') : `<p class="small muted">Belum ada carrier.</p>`}
    </div>
  `;
}

    b.onclick = ()=>{ state.logistikSmartSub = b.dataset.sub; render(); };
  });

      const item = await idbGet('checklistItems', b.dataset.apply);
      item.qty = Number(b.dataset.qty);
      await idbPut('checklistItems', item);

    [perP, src].forEach(el=> el && el.addEventListener('change', saveWaterCalc));
    applyWater.onclick = async ()=>{
      const trip = await ensureCurrentTrip();
      const pax = trip.pendakiCount, dur = getDuration(trip);
      const wc = trip.waterCalc||{perPerson:3, source:'tidak'};
      const wr = waterRecommendation(pax, dur.days, wc.perPerson, wc.source);

      if(item){ item.qty = wr.high; await idbPut('checklistItems', item); toast('Air awal diperbarui: '+wr.high+' liter'); render(); }
    };

  `);

    await idbPut('carriers', {id:uid(), tripId, label:'Carrier '+(carriers.length+1), owner:'', targetWeight:15});
    closeModal(); openManageCarriersModal(tripId);
  };
  document.getElementById('carrierListModal').addEventListener('click', async (e)=>{
    const delId = e.target.closest('[data-del]')?.dataset.del;
    if(delId){
      confirmModal('Hapus carrier ini? Barang yang ditugaskan akan menjadi belum ditugaskan.', async ()=>{
        const items = await idbGetAllByTrip('checklistItems', tripId);
        for(const it of items){ if(it.carrierId===delId){ it.carrierId=null; await idbPut('checklistItems', it); } }
        await idbDelete('carriers', delId);
        closeModal(); openManageCarriersModal(tripId);
      });
    }
  });
  document.getElementById('saveCarriersBtn').onclick = async ()=>{
    const inputs = document.querySelectorAll('[data-cid]');
    const byC = {};
    inputs.forEach(inp=>{ byC[inp.dataset.cid] = byC[inp.dataset.cid]||{}; byC[inp.dataset.cid][inp.dataset.f] = inp.value; });
    for(const cid in byC){
      const c = await idbGet('carriers', cid);
      c.label = byC[cid].label || c.label; c.owner = byC[cid].owner||''; c.targetWeight = Number(byC[cid].targetWeight)||0;
      await idbPut('carriers', c);
    }
    closeModal(); toast('Carrier diperbarui'); render();
  };
}

/* ---- AI Gear Advisor (rule-based, API-ready structure) ---- */
async function ViewAI(){
  const trip = await ensureCurrentTrip();
  return `<div class="screen">

        <button class="btn btn-primary btn-block" id="aiSubmit">Dapatkan Rekomendasi</button>
        <div class="small muted mt-8" style="text-align:center;">Rekomendasi otomatis berbasis aturan (siap diintegrasikan dengan API AI). Bukan jaminan keselamatan.</div>
      </div>
      <div id="aiResult" class="mt-12"></div>
    </div>
  </div>`;
}
function bindAI(){
  document.getElementById('aiSubmit').onclick = async ()=>{
    const input = document.getElementById('aiInput').value;
    const result = document.getElementById('aiResult');
    result.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><span>Menganalisis kebutuhanmu...</span></div>`;
    const rec = await getAIRecommendation(input); // rule-based now; swap with real API later
    result.innerHTML = `
      <div class="card">
        <div class="flex items-center gap-8"><span>✨</span><b>Rekomendasi</b></div>
        ${rec.sections.map(s=>`
          <div class="mt-12">
            <div style="font-weight:700;font-size:13.5px;">${s.icon} ${s.title}</div>
            <ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--text);line-height:1.7;">
              ${s.items.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}
            </ul>

        <p class="small muted">Rekomendasi ini adalah estimasi umum, bukan jaminan keselamatan. Selalu sesuaikan dengan kondisi cuaca dan jalur terkini.</p>
      </div>`;

}
async function getAIRecommendation(inputText){
  // Parses simple cues from free text and reuses the rule-based engine.
  // TODO: replace this function body with a real API call to an AI provider when available,
  // keeping the same return shape: {sections:[{icon,title,items:[]}]}.
  const paxMatch = inputText.match(/(\d+)\s*(orang|pendaki)/i);
  const dayMatch = inputText.match(/(\d+)\s*hari/i);
  const rain = /hujan/i.test(inputText);
  const pax = paxMatch? Number(paxMatch[1]) : 4;
  const days = dayMatch? Number(dayMatch[1]) : 3;
  const wr = waterRecommendation(pax, days, 3, 'tidak');
  return {
    sections:[
      {icon:'🎒', title:'Perlengkapan Utama', items:['Carrier sesuai durasi ('+days+' hari)','Rain cover carrier'+(rain?' (wajib, musim hujan)':''),'Headlamp + baterai cadangan cukup untuk '+days+' malam']},
      {icon:'🥫', title:'Logistik', items:['Makanan utama untuk ~'+(pax*days)+' porsi','Snack '+(pax*days*2)+' pcs','Gas kompor '+Math.max(1,Math.ceil((pax*days)/8))+' tabung']},
      {icon:'💧', title:'Air', items:['Bawa sekitar '+wr.low+'-'+wr.high+' liter air awal untuk '+pax+' pendaki']},
      {icon:'🧥', title:'Pakaian', items:[rain? 'Rain jacket & rain cover wajib (musim hujan)':'Jaket tebal untuk suhu dingin di camp','Baju ganti kering minimal 1 set', 'Kaos kaki cadangan']},
      {icon:'⛺', title:'Perlengkapan Camp', items:['Tenda tahan angin & flysheet','Sleeping bag sesuai suhu terendah']},
      {icon:'🩹', title:'Safety Equipment', items:['P3K lengkap + obat pribadi','Emergency blanket dan peluit', rain? 'Dry bag ekstra untuk melindungi elektronik':'Sunscreen & pelindung UV']},
    ]
  };
}

async function selectTrip(id){ state.currentTripId = id; await setSetting('lastTripId', id); navigate('#/dashboard'); }
async function duplicateTrip(id){
  const t = await idbGet('trips', id);
  const newId = uid();
  const copy = {...t, id:newId, mountain:t.mountain+' (Salinan)', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()};
  await idbPut('trips', copy);
  const items = await idbGetAllByTrip('checklistItems', id);
  const carrierIdMap = {};
  const carriers = await idbGetAllByTrip('carriers', id);
  for(const c of carriers){ const nid = uid(); carrierIdMap[c.id]=nid; await idbPut('carriers', {...c, id:nid, tripId:newId}); }
  for(const i of items){ await idbPut('checklistItems', {...i, id:uid(), tripId:newId, carrierId: i.carrierId? carrierIdMap[i.carrierId]||null : null, checked:false}); }
  const members = await idbGetAllByTrip('members', id);
  for(const m of members){ await idbPut('members', {...m, id:uid(), tripId:newId}); }
  const itin = await idbGetAllByTrip('itinerary', id);
  for(const it of itin){ await idbPut('itinerary', {...it, id:uid(), tripId:newId}); }
  const routes = await idbGetAllByTrip('routePoints', id);
  for(const r of routes){ await idbPut('routePoints', {...r, id:uid(), tripId:newId}); }
  toast('Pendakian diduplikat'); render();
}
function deleteTrip(id){
  confirmModal('Hapus pendakian ini beserta seluruh data checklist, tim, dan logistiknya? Tindakan ini tidak dapat dibatalkan.', async ()=>{
    await idbDelete('trips', id);
    for(const s of ['checklistItems','carriers','members','itinerary','routePoints']){ await idbDeleteByTrip(s, id); }
    if(state.currentTripId===id) state.currentTripId=null;
    toast('Pendakian dihapus'); render();
  });
}

      </div>
      <div class="card mt-12" style="text-align:center;">
        <div class="small muted">ChecklistSek — data pendakianmu disimpan di cloud (Cloud Firestore) dan tersinkron otomatis antar perangkat.<br>Koneksi internet dibutuhkan.</div>
      </div>
    </div>
  </div>`;
}
function bindSettings(){
  document.getElementById('exportBtn').onclick = async ()=>{
    const data = {};
    for(const s of STORES){ data[s] = await idbGetAll(s); }
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'checklistsek-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Data diekspor');
  };
  document.getElementById('importFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      confirmModal('Impor akan menggabungkan data dari file dengan data yang ada. Lanjutkan?', async ()=>{
        for(const s of STORES){
          if(Array.isArray(data[s])){ for(const row of data[s]){ await idbPut(s, row); } }
        }
        toast('Data berhasil diimpor'); render();
      }, false);
    }catch(err){ toast('File tidak valid','err'); }
  });
  document.getElementById('printBtn').onclick = ()=> window.print();
  document.getElementById('logoutBtn').onclick = logout;
}

/* Note: this build now stores all data in Cloud Firestore instead of
   IndexedDB, so an internet connection is required — this is intentional
   per the chosen setup (full migration, not offline-first-with-sync).
   Auth (Google + email/password) gates access, and every trip, checklist,
   member, and logistics record lives at users/{uid}/{collection}/{docId}
   in Firestore, scoped per signed-in account.
   PWA note: this build is intentionally a single index.html file, so there
   is no separate sw.js to register — browsers do not allow a service
   worker to be registered from an inline Blob URL (it must be a real
   same-origin script file), so that piece can't be folded into one file.
   The manifest above (embedded as a data: URI) still lets browsers offer
   "Add to Home Screen" / Install. */
